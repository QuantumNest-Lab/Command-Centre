services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qnl_command_centre
      POSTGRES_USER: qnl
      POSTGRES_PASSWORD: qnl_local_password
    ports:
      - "5432:5432"
    volumes:
      - qnl-postgres-data:/var/lib/postgresql/data
      - ./Backend/db/migrations:/migrations:ro
      - ./Frontend/db/migrations:/frontend-migrations:ro
volumes:
  qnl-postgres-data:
